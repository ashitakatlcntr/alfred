<h1>Politique de confidentialité</h1>
<p>Alfred est une application à usage strictement personnel et privé. Aucune donnée n'est collectée, partagée ou vendue à des tiers. L'accès à Google Calendar et Google Tasks sert uniquement à la gestion personnelle des agendas et tâches du propriétaire de l'application.</p>
